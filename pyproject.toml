[build-system]
# 77 is the floor for PEP 639: the SPDX `license` expression and `license-files` below are only
# understood from that release on. An older setuptools either drops them or errors on the unknown
# key, so the published metadata would silently lose its licence.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketllm"
version = "0.1.0"
description = "Run language models far larger than your VRAM by streaming their weights layer by layer from storage."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hadi Hajibagheri" }]
maintainers = [{ name = "Hadi Hajibagheri" }]
keywords = ["llm", "inference", "streaming", "quantization", "moe", "low-vram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base install must stay hardware-neutral: nothing here assumes a vendor, a kernel package or an
# accelerator. Everything device-specific lives in an extra below and degrades gracefully when it
# is absent.
dependencies = [
    "tqdm",
    "torch>=2.4",
    # The upper bound is where the engine has actually been run, not a guess. transformers 5
    # replaced the per-expert containers this engine streams -- Mixtral's block_sparse_moe,
    # Qwen2-MoE's per-expert ModuleList -- with a single fused expert module, so per-expert
    # streaming reads the wrong tensors against it. The whole 4.x range from the floor up is
    # covered by CI, both ends of it, on every supported Python.
    #
    # The cost of that bound is concrete and worth writing down: architectures added in 5.x cannot
    # be served here at all. qwen3_5 and qwen3_5_moe first appear in transformers 5.2, so a
    # checkpoint declaring either fails at config load. rocketllm/utils.py says exactly that when
    # it happens rather than leaving a KeyError to be interpreted. Lifting the bound is a port, not
    # a version bump: the fused layout has to be mapped back onto per-expert checkpoints first.
    #
    # Nothing in the vision-language path needs a higher floor. AutoModelForImageTextToText is
    # skipped where it does not exist and AutoModelForVision2Seq is tried instead; the checkpoint
    # name mapping is the identity on a transformers that has no such mapping, which is also the
    # transformers on which those checkpoints needed no mapping.
    "transformers>=4.49,<5.0",
    "accelerate>=1.0",
    "safetensors",
    "huggingface-hub",
    "scipy",
    "sentencepiece",
]

[project.optional-dependencies]
# Checkpoints stored in these formats need their reader; nothing else does.
quant = [
    "bitsandbytes",
    "compressed-tensors",
]
# Apple Silicon backend.
mlx = [
    "mlx",
    "psutil",
]
# Serving images to a vision-language model. Pillow decodes the picture in a request; the
# checkpoint's own processor does everything after that.
#
# torchvision is here because on several checkpoints it is not optional in practice, however much
# it looks like an accelerant. transformers builds a processor by resolving every attribute the
# processor class declares, and a video-capable one declares a video processor -- so
# AutoProcessor.from_pretrained on Qwen2.5-VL raises "AutoVideoProcessor requires the Torchvision
# library" and the checkpoint serves text only. Measured, not assumed: that is exactly what this
# extra was missing the first time it was tried against Qwen2.5-VL-7B-Instruct.
#
# Install the build that matches your torch. On CUDA that means the same index torch came from,
# e.g. pip install torchvision --index-url https://download.pytorch.org/whl/cu121 -- a mismatched
# pair pulls a second torch in behind it.
vision = [
    "pillow",
    "torchvision",
]
# `rocketllm serve` only. Someone who calls generate() from Python should not be made to install a
# web framework for it, so these are not base dependencies.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]
# httpx drives the server tests through the ASGI transport, with no socket and no accelerator.
# pillow is here because the image-decoding tests build their own pictures in memory; the suite
# still passes without it, since the tests that need it skip and the refusal path is checked either
# way.
dev = [
    "pytest",
    "ruff",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.24",
    "pillow",
]

# One console script with subcommands: `rocketllm profile` and `rocketllm serve`.
[project.scripts]
rocketllm = "rocketllm.cli:main"

[project.urls]
Homepage = "https://github.com/HajibagheriLabs/rocketllm"
Source = "https://github.com/HajibagheriLabs/rocketllm"
Issues = "https://github.com/HajibagheriLabs/rocketllm/issues"

[tool.setuptools.packages.find]
include = ["rocketllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint is a gate on things that are wrong rather than a house style: unused imports, undefined
# names, comparisons that do not do what they read as. Formatting opinions stay out of it, because
# a reformatting rule turns every future diff into noise for no defect caught.
[tool.ruff]
line-length = 120
# Notebooks are documentation that happens to be executable; they are written for readability in a
# browser and linting them would only ever produce style complaints about example code.
# tokenization_baichuan.py is vendored third-party source carrying its own copyright headers, which
# Apache 2.0 4(c) requires us to keep verbatim -- it is not ours to restructure for a lint rule.
extend-exclude = ["venv", "*.ipynb", "rocketllm/tokenization_baichuan.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# A package __init__ exists to re-export, and a re-export is an import that nothing in the file uses.
"rocketllm/__init__.py" = ["F401"]
"rocketllm/*/__init__.py" = ["F401"]
# Scripts run from a checkout put the repo root on sys.path before importing the package, which by
# construction is an import that cannot be at the top of the file.
"tests/bench_streaming.py" = ["E402"]
"tests/test_kimi_k3_split.py" = ["E402"]
"tests/make_moe_fixture.py" = ["E402"]
